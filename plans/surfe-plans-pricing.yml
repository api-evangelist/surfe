description: >-
  Surfe uses a seat-based subscription model with monthly-refilling credit
  pools. Credits are consumed separately for email finder lookups, mobile phone
  finder lookups, and company/people (ICP) searches. Higher tiers raise the
  monthly credit allotments and unlock features such as Account Lookalikes and
  the Prospect List Builder. Yearly billing offers up to 25% savings versus
  monthly. Credit consumption applies to API usage the same way it applies to
  the LinkedIn and CRM experiences.
notes: >-
  Re-read against https://www.surfe.com/pricing/ on 2026-08-13. Three tiers are
  published with a price — Free $0, Essential $39/user/month, Pro $79/user/month
  (Most popular) — each with yearly billing advertised at up to 25% off monthly.
  Credit allotments are stated PER YEAR on the page while the feature copy says
  "Credits refill every month"; both statements are Surfe's own and are recorded
  as published. The Enterprise entry below is NOT a priced tier on the pricing
  page: the page offers only "Talk to sales" / "Book a demo", so it is recorded
  as a contact-sales arrangement rather than a published plan. API access is not
  broken out as its own priced tier — API usage draws on the same credit pools
  as the LinkedIn and CRM experiences, and search credits (which raise the API
  search quotas from 200 to as much as 100,000 results/day) are enabled by
  request through api.support@surfe.com rather than purchased on the pricing
  page.
sources:
- https://www.surfe.com/pricing/
- https://developers.surfe.com/
