provider: Surfe
providerId: surfe
created: '2026-07-01'
modified: '2026-07-01'
reconciled: false
tags:
- B2B Data
- Contact Data
- Enrichment
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Surfe spend. Surfe bills a per-seat monthly subscription that
  includes monthly-refilling credit pools, then consumes credits per unit of
  work: one email finder credit per resolved professional email, one mobile
  finder credit per resolved phone number, and ICP search credits per search
  page (companies search deducts ceil(results / 25) ICP credits when credit
  charging is enabled). Optimization centers on avoiding wasted lookups -
  skipping mobile enrichment when no email is found, deduplicating inputs, and
  validating emails (unlimited) before spending finder credits.
notes: >-
  Credit-to-unit ratios and per-seat prices reflect the published Surfe pricing
  and API documentation and are subject to change; verify during reconciliation.
sources:
- https://www.surfe.com/pricing/
- https://developers.surfe.com/
- https://focus.finops.org/focus-specification/v1-3/
