source: mcp/surfe-mcp.yml + openapi/*.yml + https://developers.surfe.com/mcp
description: >-
  Binds each capability Surfe's hosted MCP server advertises to the OpenAPI
  operation that backs it, so an agent tool inherits a real inputSchema from the
  spec instead of a guessed one. Surfe's MCP tools/list is OAuth-gated, so the
  binding is by documented capability and category, not by observed tool name —
  confidence is recorded accordingly and no tool name is invented.
surfaces:
  openapi:
    files:
    - openapi/surfe-people-api-openapi.yml
    - openapi/surfe-companies-api-openapi.yml
    - openapi/surfe-recommendations-api-openapi.yml
    - openapi/surfe-account-api-openapi.yml
    base_url: https://api.surfe.com/v2
    gated: false
    note: >-
      Surfe publishes no machine-readable OpenAPI document; these specs are
      API Evangelist renderings of the published endpoint reference at
      https://developers.surfe.com. The live API host answers every anonymous
      request with 401.
  graphql:
    endpoint: null
    note: Surfe publishes no GraphQL surface.
  mcp:
    url: https://mcp.eu.surfe.com/mcp
    gated: true
    note: tools/list returns 401 invalid_token anonymously (probed 2026-08-13).
