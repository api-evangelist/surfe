name: Surfe
kind: company
description: Surfe (formerly Leadjet) is a B2B contact-data and sales-intelligence platform
  that syncs LinkedIn prospects into the CRM and exposes an API for people and company search
  plus enrichment. The Surfe API returns verified business emails and mobile phone numbers,
  company firmographics, and lookalike account recommendations, billed against a credit-based
  model.
