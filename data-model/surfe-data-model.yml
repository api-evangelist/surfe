observations:
- No read-by-id operation exists for a person or a company; the API is search-and-enrich, not CRUD.
- 'The credit meters are part of the data model, not an aside: `include` on an enrichment request selects which meter is debited.'
- 'Company appears on three different surfaces (search, enrichment, recommendations) with the same schema, so a client can treat it as one type across the whole API.'
