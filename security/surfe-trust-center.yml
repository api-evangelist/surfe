description: >-
  Surfe publishes a public security page rather than a hosted trust centre.
  There is no trust.surfe.com (DNS does not resolve) and no third-party trust
  portal (Vanta / Drata / SafeBase / Whistic) was found. The page names two
  postures — ISO/IEC 27001 certification and GDPR compliance as both processor
  and controller — and describes encryption, access and incident-response
  practices in prose. No certification report, audit letter, or evidence
  download is offered, and SOC 2 is not claimed.
