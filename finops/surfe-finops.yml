meters:
- name: seats
  description: Per-user monthly subscription seats.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: email_finder_credits
  description: Credits consumed resolving a verified professional email.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - user
- name: mobile_finder_credits
  description: Credits consumed resolving a mobile phone number.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - user
- name: search_credits
  description: >-
    ICP/search credits consumed per search page; companies search deducts
    ceil(results / 25) credits when credit charging is enabled.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - user
principles:
- name: Visibility
  description: >-
    Poll GET /credits to track remaining email, mobile, and search credit pools
    before launching bulk enrichment jobs.
- name: Allocation
  description: >-
    Issue and tag API keys per team/workflow so credit burn maps to internal
    cost centers.
- name: Optimization
  description: >-
    Validate emails (unlimited) before spending finder credits; set
    skipMobileEnrichmentIfNoEmailFound to avoid mobile spend on low-confidence
    records; deduplicate inputs; batch up to 10,000 people per request.
- name: Accountability
  description: >-
    Assign owners per seat/key and review monthly credit consumption against the
    plan's refilling allotment and any overage.
