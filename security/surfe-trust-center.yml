stated_controls:
- CRM data accessed on demand only, over secured API connections, never without consent.
- Data never sold under any circumstances.
- Encryption in transit and at rest, including encrypted databases and secure OAuth token storage.
- Salesforce OAuth used for user authentication so credentials are not entered into Surfe.
- Disaster and incident-response plans maintained, tested and audited annually.
- Data backed up ("Data rescue").
